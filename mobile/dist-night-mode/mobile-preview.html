<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elladria · Mobile Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#131b2e;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}h1{font-size:18px;margin:0}select,a{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#131b2e;text-decoration:none}.phone{padding:10px;background:#131b2e;border-radius:38px;box-shadow:0 18px 60px #131b2e26}iframe{display:block;width:390px;height:844px;border:0;border-radius:28px;background:#f8f9ff}p{margin:0;color:#596474;font-size:12px;text-align:center}@media(max-width:450px){body{padding:12px 0}.phone{padding:0;border-radius:0;max-width:100%}iframe{max-width:100vw;border-radius:0}}</style></head><body><header><h1>Elladria · Mobile preview</h1><select aria-label="Phone screen size" id="size"><option value="390,844">iPhone size · 390 × 844</option><option value="412,915">Android size · 412 × 915</option><option value="360,800">Small phone · 360 × 800</option></select><a href="/?admin=1" target="_blank">Admin panel ↗</a></header><div class="phone"><iframe id="app" src="/" title="Elladria mobile app"></iframe></div><p>Published admin changes refresh automatically while connected.</p><script>document.getElementById('size').addEventListener('change',event=>{const [width,height]=event.target.value.split(',');const app=document.getElementById('app');app.style.width=width+'px';app.style.height=height+'px';});</script></body></html>
