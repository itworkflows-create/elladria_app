<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Elladria - Select Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .language-card {
            transition: all 0.3s ease;
        }
        .language-card:hover {
            transform: translateY(-2px);
            box-shadow: 0px 10px 15px -3px rgba(0,0,0,0.1);
        }
        .language-card:active {
            transform: translateY(0);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Top Navigation (Shell suppressed for linear task focus, just showing brand) -->
<header class="w-full flex justify-center items-center py-xl">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">Elladria</h1>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop w-full max-w-[1200px] mx-auto pb-xl">
<div class="text-center mb-xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">Select Your Language</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                Please choose your preferred language to continue with your Elladria journey.
            </p>
</div>
<div class="w-full max-w-md space-y-md">
<!-- Sinhala Option -->
<button class="language-card w-full flex items-center justify-between bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-md">
<span aria-hidden="true" class="text-4xl">🇱🇰</span>
<div class="text-left">
<span class="block font-headline-md text-headline-md text-on-surface">සිංහල</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">Sinhala</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" data-weight="regular">chevron_right</span>
</button>
<!-- Tamil Option -->
<button class="language-card w-full flex items-center justify-between bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-md">
<span aria-hidden="true" class="text-4xl">🇱🇰</span>
<div class="text-left">
<span class="block font-headline-md text-headline-md text-on-surface">தமிழ்</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">Tamil</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" data-weight="regular">chevron_right</span>
</button>
<!-- English Option -->
<button class="language-card w-full flex items-center justify-between bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-md">
<span aria-hidden="true" class="text-4xl">🇬🇧</span>
<div class="text-left">
<span class="block font-headline-md text-headline-md text-on-surface">English</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant">English</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" data-weight="regular">chevron_right</span>
</button>
</div>
</main>
